name: offer-helper

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: offer-helper-app
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-dev}
      # Always use Compose service hostnames inside the app container.
      DATABASE_URL: postgresql+asyncpg://offer:offer@postgres:5432/offer_helper
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - offer-helper-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:18.6
    container_name: offer-helper-postgres
    environment:
      POSTGRES_USER: offer
      POSTGRES_PASSWORD: offer
      POSTGRES_DB: offer_helper
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - offer-helper-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offer -d offer_helper"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.0.2
    container_name: offer-helper-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - offer-helper-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    command: ["redis-server", "--appendonly", "yes"]

networks:
  offer-helper-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
